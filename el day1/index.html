```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fa;
}

.container{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#1f2937;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#374151;
}

input{
    width:100%;
    padding:13px 15px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 5px rgba(37,99,235,.3);
}

.checkbox{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    margin-bottom:20px;
}

.checkbox input{
    width:auto;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.login{
    text-align:center;
    margin-top:20px;
    font-size:15px;
}

.login a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

.login a:hover{
    text-decoration:underline;
}

@media(max-width:480px){
    .container{
        margin:20px;
        padding:25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>Create Your Account</h2>
    <p class="subtitle">Sign up to get started.</p>

    <form action="login.html">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email address" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required minlength="8">
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password" required minlength="8">
        </div>

        <div class="checkbox">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the Terms & Conditions</label>
        </div>

        <button type="submit">Create Account</button>

    </form>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

</body>
</html>
```
